<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!-- HOME-004: Numa's eclipse mark on its own dark tile, so it reads on light and dark tabs alike (the bare mark's light disc vanishes on a light ground). -->
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0e0e0e"/></linearGradient>
<radialGradient id="d" cx="0.3" cy="0.3" r="0.9"><stop offset="0" stop-color="#6a6a6a"/><stop offset="1" stop-color="#363636"/></radialGradient>
<radialGradient id="l" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3a3a3a"/><stop offset="0.55" stop-color="#9a9a9a"/><stop offset="0.85" stop-color="#e6e6e6"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="url(#g)" stroke="#fff" stroke-opacity="0.16"/>
<circle cx="20.25" cy="16" r="8.5" fill="url(#d)"/>
<circle cx="11.75" cy="16" r="8.5" fill="url(#l)"/>
</svg>
