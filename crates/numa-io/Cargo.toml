[package]
name = "numa-io"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
dump-switches = []
gpu = ["dep:numa-gpu"]

[dependencies]
numa-core = { path = "../numa-core" }
numa-cull = { path = "../numa-cull" }
numa-infer = { path = "../numa-infer" }
numa-gpu = { path = "../numa-gpu", optional = true }
numa-render = { path = "../numa-render" }
byteorder.workspace = true
dirs.workspace = true
image.workspace = true
kamadak-exif.workspace = true
roxmltree.workspace = true
log.workspace = true
rawler.workspace = true
rayon.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
heic-rs.workspace = true
flate2 = "1"
half = "2.7"
ruzstd = "0.9"
libc.workspace = true
ndarray.workspace = true
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
avif-serialize = "0.8"
jpeg-encoder = { version = "0.6", features = ["simd"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128", "std"] }

qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }

[dev-dependencies]
lensfun = "=0.7.0"
env_logger.workspace = true

[[example]]
name = "mac_bench"
required-features = ["gpu"]
