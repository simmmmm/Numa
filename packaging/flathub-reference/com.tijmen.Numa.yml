id: com.tijmen.Numa
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: numa

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --system-talk-name=org.freedesktop.ColorManager

modules:
  - name: onnxruntime
    buildsystem: simple
    build-commands:
      - install -d /app/lib
      - cp -a lib/libonnxruntime.so* /app/lib/
      - install -Dm644 ThirdPartyNotices.txt
        /app/share/licenses/com.tijmen.Numa/onnxruntime/ThirdPartyNotices.txt
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-x64-1.28.0.tgz
        sha256: a3e1b79d7bb1bf09696ce675f49e4064e6c81f6202b8225624fff0e93f8d6407
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/onnxruntime-linux-aarch64-1.28.0.tgz
        sha256: e15ff8b5d85afe6c144d97c6fd432254bf76a219daaf17658087d6ecb3e8f0bb

  - name: camera-profiles
    buildsystem: simple
    build-commands:
      - install -d /app/share/numa/profiles
      - install -m644 rtdata/dcpprofiles/*.dcp /app/share/numa/profiles/
      - install -Dm644 LICENSE /app/share/numa/profiles/LICENSE.GPL-3.0.txt
      - install -Dm644 profiles-README.txt /app/share/numa/profiles/README.txt
    sources:
      - type: git
        url: https://github.com/Beep6581/RawTherapee.git
        tag: '5.11'
        commit: db575c6690d30ce6428c0e1383bec8b8f1fb8d21
      - type: file
        path: ../flatpak/profiles-README.txt

  - name: numa
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/numa/cargo
        CARGO_NET_OFFLINE: 'true'
        ORT_LIB_PATH: /app/lib
        ORT_PREFER_DYNAMIC_LINK: '1'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/numa /app/bin/numa
      - install -Dm644 data/com.tijmen.Numa.desktop /app/share/applications/com.tijmen.Numa.desktop
      - install -Dm644 data/com.tijmen.Numa.metainfo.xml /app/share/metainfo/com.tijmen.Numa.metainfo.xml
      - for size in 32 48 64 128 256; do
          for name in com.tijmen.Numa com.tijmen.Numa-dark; do
            install -Dm644 data/icons/hicolor/${size}x${size}/apps/$name.png
              /app/share/icons/hicolor/${size}x${size}/apps/$name.png;
          done;
        done
      - install -Dm644 -t /app/share/icons/hicolor/scalable/actions
        data/icons/hicolor/scalable/actions/*.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .git
          - .claude
          - presets data
          - tests/corpus
          - fable-tickets
          - fable-tickets.old
          - packaging/appimage/AppDir
      - cargo-sources.json
