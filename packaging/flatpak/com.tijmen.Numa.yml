id: com.tijmen.Numa
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: numa

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --system-talk-name=org.freedesktop.ColorManager
  - --device=all

modules:
  - name: libgphoto2
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/doc
      - /share/man
      - '*.la'
      - /lib/libgphoto2/print-camera-list
    config-opts:
      - --disable-static
      - --without-libusb  # libusb-1.0 only
    sources:
      - type: archive
        url: https://github.com/gphoto/libgphoto2/releases/download/v2.5.34/libgphoto2-2.5.34.tar.xz
        sha256: 51993f5d9bfb6b4e5925cbbe5883085791bff6f81bcacb8ffe1b783ce76d586a

  - name: protobuf-c
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    config-opts:
      - --disable-static
      - --disable-protoc
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/protobuf-c/LICENSE
    sources:
      - type: archive
        url: https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.2/protobuf-c-1.5.2.tar.gz
        sha256: e2c86271873a79c92b58fef7ebf8de1aa0df4738347a8bd5d4e65a80a16d0d24

  - name: libshumate
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
    config-opts:
      - -Dgir=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Ddemos=false
      - -Dsysprof=disabled
    post-install:
      - install -Dm644 COPYING /app/share/licenses/libshumate/COPYING
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz
        sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5

  - name: camera-profiles
    buildsystem: simple
    build-commands:
      - install -d /app/share/numa/profiles
      - install -m644 rtdata/dcpprofiles/*.dcp /app/share/numa/profiles/
      - install -Dm644 LICENSE /app/share/numa/profiles/LICENSE.GPL-3.0.txt
      - install -Dm644 profiles-README.txt /app/share/numa/profiles/README.txt
    sources:
      - type: git
        url: https://github.com/Beep6581/RawTherapee.git
        tag: '5.11'
      - type: file
        path: profiles-README.txt

  - name: numa
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/numa/cargo
      build-args:
        - --share=network
    build-commands:
      - cargo build --profile dist
      - install -Dm755 target/dist/numa /app/bin/numa
      - install -Dm644 -t /app/share/licenses/com.tijmen.Numa/onnxruntime data/onnxruntime/*
      - install -Dm644 -t /app/share/numa/lensfun data/lensfun/*
      - if [ -d data/private-profiles ]; then
          install -Dm644 -t /app/share/numa/profiles/numa data/private-profiles/*;
        fi
      - install -Dm644 data/com.tijmen.Numa.desktop
        /app/share/applications/com.tijmen.Numa.desktop
      - install -Dm644 data/com.tijmen.Numa.metainfo.xml
        /app/share/metainfo/com.tijmen.Numa.metainfo.xml
      - for size in 32 48 64 128 256; do
          for name in com.tijmen.Numa com.tijmen.Numa-dark; do
            install -Dm644 data/icons/hicolor/${size}x${size}/apps/$name.png
              /app/share/icons/hicolor/${size}x${size}/apps/$name.png;
          done;
        done
      - install -Dm644 -t /app/share/icons/hicolor/scalable/actions
        data/icons/hicolor/scalable/actions/*.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - .git
          - .claude
          - presets data
          - tests/corpus
          - fable-tickets
          - fable-tickets.old
          - packaging/appimage/AppDir
