[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.19.3"
edition = "2021"
license-file = "LICENSE"

[package]
name = "numa"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish = false

[features]
dump-switches = ["numa-io/dump-switches", "numa-infer/dump-switches"]

[dependencies]
numa-core = { path = "crates/numa-core" }
numa-cull = { path = "crates/numa-cull" }
numa-infer = { path = "crates/numa-infer" }
numa-io = { path = "crates/numa-io" }
numa-render = { path = "crates/numa-render" }
gtk.workspace = true
adw.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
rawler.workspace = true
dirs.workspace = true
image.workspace = true
rayon.workspace = true
log.workspace = true
byteorder.workspace = true
env_logger.workspace = true
libc.workspace = true
ort.workspace = true
ndarray.workspace = true
lensfun.workspace = true
heic-rs.workspace = true
zip.workspace = true
kamadak-exif.workspace = true
pangocairo = "0.22"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rawler = "0.8.0"
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12.0"
log = "0.4.34"
byteorder = "1.5.0"
env_logger = "0.11.11"
libc = "0.2"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
ndarray = "0.17"
lensfun = "0.7.0"
heic-rs = "0.1.1"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
kamadak-exif = "0.6.1"

[profile.dev]
debug = "line-tables-only"
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.rawler]
opt-level = 3
overflow-checks = false
