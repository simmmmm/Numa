# `cargo deny check licenses`: every crate built into Numa has a licence
# compatible with GPL-3.0-or-later. (dev/third-party-licences.py writes the
# texts that ship in About.)
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "aarch64-apple-ios"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
    "GPL-3.0-or-later", "GPL-3.0", "LGPL-2.1", "LGPL-2.1-or-later", "LGPL-3.0", "OpenSSL", "0BSD",
    "CDLA-Permissive-2.0", "Unlicense", "IJG", "LGPL-2.1-only",
]
unused-allowed-license = "allow"

# RUSTSEC-2024-0436: paste is unmaintained, a proc-macro pulled in by rav1e
# (numa-io's AVIF encoder). No newer rav1e drops it; it is not a vulnerability.
[advisories]
ignore = ["RUSTSEC-2024-0436"]
