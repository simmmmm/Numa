[package]
edition = "2024"
rust-version = "1.89"
name = "rawler"
version = "0.8.0"
authors = [
    "Daniel Vogelbacher <daniel@chaospixel.com>",
    "Pedro Côrte-Real <pedro@pedrocr.net>",
]
build = "data/join.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library to extract images and metadata from camera raw formats"
homepage = "https://github.com/dnglab/dnglab"
readme = "README.md"
keywords = [
    "camera",
    "raw",
]
categories = ["multimedia::images"]
license = "LGPL-2.1"
repository = "https://github.com/dnglab/dnglab"
resolver = "2"

[features]
clap = ["dep:clap"]
inspector = []
rawdb = [
    "dep:ureq",
    "dep:percent-encoding",
]

[lib]
name = "rawler"
path = "src/lib.rs"

[dependencies.backtrace]
version = "0.3"

[dependencies.bitstream-io]
version = "4.1"

[dependencies.byteorder]
version = "1"

[dependencies.chrono]
version = "0.4"

[dependencies.clap]
version = "4.4.0"
optional = true

[dependencies.enumn]
version = "0.1"

[dependencies.hex]
version = "0.4"

[dependencies.image]
version = "0.25"
features = ["jpeg"]
default-features = false

[dependencies.itertools]
version = "0.14"

[dependencies.jxl-oxide]
version = "0.12.2"

[dependencies.lazy_static]
version = "1"

[dependencies.libflate]
version = "2.0"

[dependencies.log]
version = "0.4"

[dependencies.md5]
version = "0.8"

[dependencies.memmap2]
version = "0.9.4"

[dependencies.multiversion]
version = "0.8"

[dependencies.num]
version = "0.4"

[dependencies.num_enum]
version = "0.7"

[dependencies.percent-encoding]
version = "2"
optional = true

[dependencies.rayon]
version = "1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.thiserror]
version = "2.0"

[dependencies.toml]
version = "0.8"

[dependencies.ureq]
version = "2"
features = ["tls"]
optional = true
default-features = false

[dependencies.uuid]
version = "1.0"
features = [
    "serde",
    "v4",
]

[dependencies.weezl]
version = "0.1.7"

[dependencies.zerocopy]
version = "0.8.26"
features = ["derive"]

[build-dependencies.glob]
version = "0.3"

[build-dependencies.rustc_version]
version = "0.4"

[build-dependencies.toml]
version = "=0.8"

[lints.clippy]
collapsible_if = "allow"
unwrap_used = "warn"
